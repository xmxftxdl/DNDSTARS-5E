name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - desktop-v*

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify desktop updater
        run: npm run test:desktop

      - name: Build local game client
        run: npm run build

      - name: Create versioned client package and manifest
        env:
          ASTRALTRACE_DESKTOP_RELEASE_PRIVATE_KEY: ${{ secrets.ASTRALTRACE_DESKTOP_RELEASE_PRIVATE_KEY }}
        run: npm run desktop:client:package

      - name: Build unsigned Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astraltrace-windows-x64
          path: |
            artifacts/desktop/AstralTrace-Setup-x64.exe
            artifacts/desktop/AstralTrace-Setup-x64.exe.blockmap
            artifacts/desktop/latest.yml
            artifacts/desktop-client/AstralTrace-client-win32-x64.zip
            artifacts/desktop-client/desktop-client-manifest.json
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: false
          files: |
            artifacts/desktop/AstralTrace-Setup-x64.exe
            artifacts/desktop/AstralTrace-Setup-x64.exe.blockmap
            artifacts/desktop/latest.yml
            artifacts/desktop-client/AstralTrace-client-win32-x64.zip
            artifacts/desktop-client/desktop-client-manifest.json
