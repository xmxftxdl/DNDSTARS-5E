# Pull-request and release gate. The complete browser soak remains local, while
# deterministic account/plugin production paths run in CI.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, lockfile-pinned)
        run: npm ci

      - name: Type-check (tsc -b)
        run: npx tsc -b

      - name: Unit tests (vitest, environment:node, no external deps)
        run: npx vitest run

      - name: SRD 5.1 publication audit
        run: npm run audit:srd-content

      - name: ESLint ratchet (no-new-errors vs .eslint-ratchet.json)
        run: npm run lint:ratchet

      - name: Production dependency audit
        run: npm run audit:production

      - name: Production build and bundle budget
        run: npm run build:check

      - name: Docker production image
        run: docker build --build-arg "STARS_BUILD_ID=ci-${GITHUB_SHA}" --tag dndstars-5e:ci .

      - name: Complete PostgreSQL and shared-data restore drill
        env:
          STARS_APP_IMAGE: dndstars-5e:ci
        run: bash scripts/run-disaster-recovery-integration.sh

      - name: Live restore and automatic rollback drill
        env:
          STARS_APP_IMAGE: dndstars-5e:ci
        run: bash scripts/run-live-restore-integration.sh

  browser-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, lockfile-pinned)
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Account and plugin release E2E
        run: >-
          npx playwright test
          e2e/account-auth-lifecycle.spec.ts
          e2e/account-campaign-workspace.spec.ts
          e2e/plugin-catalog-lifecycle.spec.ts
          e2e/plugin-moderation-lifecycle.spec.ts
          --reporter=line

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  postgres-release-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: astraltrace_ci
          POSTGRES_USER: astraltrace_ci
          POSTGRES_PASSWORD: astraltrace-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astraltrace_ci -d astraltrace_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STARS_TEST_DATABASE_URL: postgresql://astraltrace_ci:astraltrace-ci-password@127.0.0.1:5432/astraltrace_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (clean, lockfile-pinned)
        run: npm ci

      - name: PostgreSQL migration, campaign index and finance invariants
        run: npm run test:postgres
